# Configuration de la console
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n
# Configuration du fichier
appender.file.type=File
appender.file.name=LOGFILE
appender.file.fileName=logs/findcar.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n
# Logger principal : niveau par défaut
rootLogger.level=warn
rootLogger.appenderRefs=console, file
rootLogger.appenderRef.console.ref=STDOUT
rootLogger.appenderRef.file.ref=LOGFILE
# Logger de l'application : DEBUG
logger.application.name=fr.greta.soutenance2
logger.application.level=debug
logger.application.additivity=true
# Bibliothèques externes : WARN
logger.htmlunit.name=org.htmlunit
logger.htmlunit.level=warn
logger.apache.name=org.apache
logger.apache.level=warn
logger.javafx.name=javafx
logger.javafx.level=warn
